# Raspberry Pi 5 on the robot. Pin numbers live in mirae/config.py defaults;
# override them in /etc/mirae/mirae.toml rather than editing this file.
[hardware]
backend = "pi"

[api]
host = "127.0.0.1"
database_path = "/var/lib/mirae/mirae.sqlite3"

[ai]
provider = "none"

[vision]
source = "picamera2"
