[project]
name = "mirae"
version = "0.1.0.dev0"
description = "Software stack for Mirae, a small AI-powered Raspberry Pi 5 robot"
readme = "README.md"
# Raspberry Pi OS Bookworm ships Python 3.11, Trixie ships 3.13. The Pi venv
# uses the system interpreter (for apt-only picamera2/libcamera), so both must work.
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "cryptography>=44",
]

[project.optional-dependencies]
# Raspberry Pi hardware. lgpio and picamera2 are NOT listed: install them with apt
# and create the venv with --system-site-packages (see deploy/pi/install.sh).
pi = [
    "gpiozero>=2.0.1",
    "smbus2>=0.4",
    "vl53l1x>=0.0.5",
]
vision = [
    "numpy>=1.26",
    # MobileNet SSD uses the Caffe importer removed by OpenCV 5.
    "opencv-python-headless==4.13.0.92",
    "cv2-enumerate-cameras==1.4.0",
    "onnxruntime>=1.18",
]
faces = [
    "face-recognition>=1.3",
    "dlib==20.0.1",
    "setuptools==80.9.0",
]
speech = [
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "faster-whisper>=1.0",
    "piper-tts>=1.3",
]

[project.scripts]
mirae = "mirae.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirae"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Blender scripts follow their own conventions and run inside Blender's Python.
extend-exclude = ["cad"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Pi / heavy optional deps: not installed on dev machines or in the default CI job.
module = [
    "gpiozero.*", "VL53L1X.*", "picamera2.*", "cv2.*", "onnxruntime.*",
    "faster_whisper.*", "piper.*", "sounddevice.*", "numpy.*", "face_recognition.*",
    "cv2_enumerate_cameras.*", "av.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
